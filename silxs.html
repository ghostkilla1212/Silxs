<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silxs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Isometra&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="silxs.css">
     <link rel="stylesheet" href="aboutme button.css">
     <link rel="stylesheet" href="searchbar.css">

<body>
     <div class="header">
        <navbar>
    <img class="logo" src="silxs sachen/logo.png" alt="Logo">

  <button id="AboutMe">
    <img src="silxs sachen/aboutme.png">
  </button>

  <div class="search-bar">
    <label for="gsearch">Have fun searching!</label>
<input type="search" id="gsearch" name="gsearch">
    <button class="search-button" type="button">search</button>
  </div>


  <h1 id="RecentlySearched">RecentlySearche</h1>
<div id="popup"></div>
  </navbar>
<!-- header bereich -->


<div class="image-slider">
    <img src="silxs sachen/image slider/image 1.png">
    <img src="silxs sachen/image slider/image 2.png">
    <img src="silxs sachen/image slider/image 3.png">
</div>

  <button id="stopButton" type="button" aria-label="Diashow pausieren oder fortsetzen">
<img src="silxs sachen/icons/pause.png">
</button>



<div class="catigory-list">
  <button class="catigory-button" id="catigory1">gaming stuff</button>
  <button class="catigory-button" id="catigory2">sport clothing</button>
  <button class="catigory-button" id="catigory3">tv stuff</button>
  <button class="catigory-button" id="catigory4">electronics</button>
  <button class="catigory-button" id="catigory5">gaming console</button>
  <button class="catigory-button" id="All6">All</button>
</div>



<div class="product-gallery">

    <div class="product-card">
        <img src="https://images.pexels.com/photos/30254262/pexels-photo-30254262.jpeg" alt="Produkt 1">
        <p>2 Euro</p>
    </div>

    <div class="product-card">
        <img src="Gemini_Generated_Image_kxrpy9kxrpy9kxrp.png" alt="Produkt 2">
        <p>3 Euro</p>
    </div>

    <div class="product-card">
        <img src="Gemini_Generated_Image_in3rdgin3rdgin3r.png" alt="Produkt 3">
        <p>5 Euro</p>
    </div>

</div>







<!-- mobile bereich -->
 <buttons id="myMenu">
    <img src="silxs sachen/icons/menu (1).png" class="menus">
 </buttons>

 <div id="mobileMenuSidebar">
  <button id="closeButton">x</button>

      <div class="mobile-search">
        <input type="search" placeholder="Search">
    </div>

    <buttons id="mobileAboutMe">about me</buttons>

     <buttons id="myMenu">
    <img src="silxs sachen/icons/menu (1).png" class="menus">
 </buttons>
    <script src="silxs.js"></script>
    <script src="catigory.js"></script>
    <script src="menu.js"></script>
    <script src="image slider.js"></script>
     <script src="aboutme button.js"></script>
     <script src="search bar.js"></script>
